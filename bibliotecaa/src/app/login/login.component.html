<h2>Iniciar Sesion<h2>
    <form (ngSubmit)="iniciarSesion()">
        <label>Usuario</label>
        <input name="usuario" type="text" name="usuario" [(ngModel)]="usuario">
        <label>Contraseña</label>
        <input name="password" type="password" name="password" [(ngModel)]="password">
    </form>
<p>{{mensaje}}</p>
